name: OSINT Toolkit bug report
description: Report a reproducible defect without disclosing secrets or unauthorized target data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, personal information, or raw evidence from systems you are not authorized to test.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide a package version or commit SHA.
      placeholder: "0.1.0 / commit SHA"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Use synthetic input and redact target identifiers.
      placeholder: Steps and command output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: dropdown
    id: side_effects
    attributes:
      label: Does reproducing this contact a network or modify files?
      options:
        - No, synthetic/offline only
        - Yes, explicitly authorized scope only
        - Unknown
    validations:
      required: true
