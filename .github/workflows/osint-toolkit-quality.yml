name: OSINT Toolkit quality matrix

on:
  pull_request:
    paths:
      - "osint-toolkit/**"
      - ".github/workflows/osint-toolkit-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / tests and static checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: osint-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Report Ruff findings (initially non-blocking)
        run: ruff check src tests --output-format=github --exit-zero
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run tests
        run: pytest -q
