name: aurora_phase1 CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  aurora_phase1-tests:
    name: aurora_phase1 tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Run aurora_phase1 test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s aurora_phase1/tests -v

      - name: Run demo_phase1 (5 proofs)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python aurora_phase1/demo_phase1.py

      - name: Rebuild ledger from findings
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python aurora_phase1/evidence/build_ledger.py
