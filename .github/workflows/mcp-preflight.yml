name: MCP connectivity preflight tests

on:
  pull_request:
    paths:
      - "scripts/aurora_mcp_preflight.py"
      - "tests/test_mcp_preflight.py"
      - "docs/MCP_CONNECTION_PREFLIGHT.md"
      - ".github/workflows/mcp-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Read-only preflight unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile preflight module
        run: python -m py_compile scripts/aurora_mcp_preflight.py
      - name: Run isolated test module
        run: python -m pytest -q tests/test_mcp_preflight.py
