name: Aurora NoCloud VM validation v4

on:
  push:
    branches:
      - automation/aurora-nocloud-v4-validation-20261102

permissions:
  contents: read

concurrency:
  group: aurora-nocloud-v4-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  two-boot-nocloud:
    name: Debian 13 amd64 — two real boots with NoCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4

      - name: Reassemble minimal guest payload and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora-payload"
          cat automation/aurora-nocloud-v4/payload-v42/part-*.b64 | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/aurora-nocloud-v42.tar.xz"
          echo "expected_sha256=43f7987d172a62a38a23f20ec42cc8de8d6874bebefcbb4c8b7cb112b33a2ee3"
          actual="$(sha256sum "$RUNNER_TEMP/aurora-nocloud-v42.tar.xz" | awk '{print $1}')"
          echo "actual_sha256=$actual"
          test "$actual" = "43f7987d172a62a38a23f20ec42cc8de8d6874bebefcbb4c8b7cb112b33a2ee3"
          xz -t "$RUNNER_TEMP/aurora-nocloud-v42.tar.xz"
          tar -tJf "$RUNNER_TEMP/aurora-nocloud-v42.tar.xz"
          tar -xJf "$RUNNER_TEMP/aurora-nocloud-v42.tar.xz" -C "$RUNNER_TEMP/aurora-payload"
          test -s "$RUNNER_TEMP/aurora-payload/aurora-kasan-cloud-init.yaml"
          test -s "$RUNNER_TEMP/aurora-payload/aurora-vm-nocloud-test.sh"
          test -s "$RUNNER_TEMP/aurora-payload/verify_vm_evidence.py"
          python3 -m py_compile "$RUNNER_TEMP/aurora-payload/verify_vm_evidence.py"

      - name: Confirm hosted x86_64 runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          . /etc/os-release
          printf 'runner_os=%s\nrunner_version=%s\n' "$ID" "$VERSION_ID"
          test "$ID" = ubuntu
          test "$(uname -m)" = x86_64
          df -h "$RUNNER_TEMP"
          id
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "host_kvm=available"
          else
            echo "host_kvm=unavailable; runner will use QEMU TCG"
          fi

      - name: Install QEMU with KVM detection and TCG fallback
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils e2fsprogs wget coreutils python3 python3-yaml xz-utils
          qemu-system-x86_64 --version
          qemu-system-x86_64 -accel help | grep -w tcg
          qemu-img --version
          cloud-localds --help >/dev/null

      - name: Add importable allocator module alias to cloud-init
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aurora-payload"
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import yaml

          path = Path(__import__("os").environ["RUNNER_TEMP"]) / "aurora-payload" / "aurora-kasan-cloud-init.yaml"
          text = path.read_text(encoding="utf-8")
          assert text.startswith("#cloud-config")
          cfg = yaml.safe_load(text)
          files = cfg["write_files"]
          src = next((item for item in files if item.get("path") == "/usr/local/sbin/aurora-configure-subids.py"), None)
          assert src is not None
          assert src["content"].lstrip().startswith("#!/usr/bin/env python3")
          alias_path = "/usr/local/sbin/aurora_configure_subids.py"
          old = [item for item in files if item.get("path") == alias_path]
          if old:
              assert len(old) == 1 and old[0]["content"] == src["content"]
          else:
              alias = copy.deepcopy(src)
              alias["path"] = alias_path
              files.append(alias)
          rendered = "#cloud-config\n" + yaml.safe_dump(cfg, sort_keys=False, allow_unicode=True, width=1000)
          check = yaml.safe_load(rendered)
          aliases = [item for item in check["write_files"] if item.get("path") == alias_path]
          assert len(aliases) == 1 and aliases[0]["content"] == src["content"]
          capture = next(item for item in check["write_files"] if item.get("path") == "/usr/local/sbin/aurora-capture-subid-evidence.sh")
          assert "AURORA_VM_WAITING_FOR_HOST_QMP_RESET" in capture["content"]
          assert "systemctl reboot --no-block" not in capture["content"]
          path.write_text(rendered, encoding="utf-8")
          print("importable_module_alias=PASS")
          print("allocator_alias_sha256_matches=PASS")
          PY

      - name: Execute Debian 13 GenericCloud NoCloud two-boot test
        id: vmtest
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aurora-payload"
          export AURORA_VM_EVIDENCE_DIR="$RUNNER_TEMP/aurora-vm-evidence"
          export AURORA_QEMU_RAM_MB=1024
          export AURORA_QEMU_CPUS=1
          export AURORA_QEMU_ACCEL=auto
          bash "$ROOT/aurora-vm-nocloud-test.sh"

      - name: Verify required guest evidence and create run manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aurora-vm-evidence"
          mkdir -p "$OUT"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "runner_arch=$(uname -m)"
            echo "runner_os=$( . /etc/os-release; echo "$PRETTY_NAME" )"
            echo "collected_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for report in "$OUT/boot-1.txt" "$OUT/boot-2.txt"; do
              if [[ -s "$report" ]]; then
                echo "----- $(basename "$report") -----"
                cat "$report"
              else
                echo "MISSING: $(basename "$report")"
              fi
            done
          } > "$OUT/workflow-run-manifest.txt"
          pending=0
          missing=""
          for name in boot-1.txt boot-2.txt serial.log host-run.txt qmp-reset.json workflow-run-manifest.txt; do
            if [[ ! -s "$OUT/$name" ]]; then
              pending=1
              missing="$missing $name"
            fi
          done
          if [[ "$pending" -eq 0 ]]; then
            (cd "$OUT" && sha256sum boot-1.txt boot-2.txt serial.log host-run.txt qmp-reset.json workflow-run-manifest.txt > SHA256SUMS)
            set +e
            python3 "$RUNNER_TEMP/aurora-payload/verify_vm_evidence.py" "$OUT" > "$OUT/verification.json"
            verify_rc=$?
            set -e
            echo "evidence_verifier_exit_code=$verify_rc"
            cat "$OUT/verification.json"
            if [[ "$verify_rc" -ne 0 ]]; then exit "$verify_rc"; fi
          else
            printf '{"status":"PENDING","classification":"EVIDENCE_INCOMPLETE","missing":"%s"}\n' "$missing" > "$OUT/verification.json"
            echo "evidence_status=PENDING"
            printf 'missing=%s\n' "$missing"
            (cd "$OUT" && find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.partial' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.partial)
          fi

      - name: Upload VM evidence, including partial failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-nocloud-vm-evidence
          path: ${{ runner.temp }}/aurora-vm-evidence/
          if-no-files-found: warn
          retention-days: 14
