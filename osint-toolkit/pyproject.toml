[project]
name = "osint-toolkit"
version = "0.1.0"
description = "Aurora-safe OSINT toolkit: passive collection, normalized evidence."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "dnspython>=2.6",
  "requests>=2.31",
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
osint-toolkit = "osint_toolkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_toolkit"]
