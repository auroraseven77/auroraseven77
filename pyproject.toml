[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuu-engine"
version = "2.1.0"
description = "Temporal Unified Unit (TUU) v2.1 Deterministic Invariant Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
]

[tool.setuptools.packages.find]
include = ["TUU*", "Tuu_panel*"]
