name: OSINT Toolkit security and SBOM

on:
  pull_request:
    paths:
      - "osint-toolkit/**"
      - ".github/workflows/osint-toolkit-security.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osint-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pip-audit bandit cyclonedx-bom
      - name: Audit installed Python dependencies
        run: pip-audit
      - name: Static security scan
        run: bandit -q -r src
      - name: Generate environment SBOM
        run: cyclonedx-py environment --output-format JSON --output-file osint-toolkit-sbom.cdx.json
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: osint-toolkit-sbom
          path: osint-toolkit/osint-toolkit-sbom.cdx.json
          if-no-files-found: error
