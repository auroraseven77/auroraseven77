name: osint-toolkit-tests

on:
  push:
    paths:
      - "osint-toolkit/**"
  pull_request:
    paths:
      - "osint-toolkit/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osint-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
